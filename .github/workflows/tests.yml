name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / behave ${{ matrix.behave }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        behave: ["release"]
        include:
          # -- EARLY WARNING: Development version of behave.
          - {os: ubuntu-latest, python-version: "3.13", behave: "main"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[testing]"
      - name: Install behave (development version)
        if: matrix.behave == 'main'
        run: python -m pip install "behave @ git+https://github.com/behave/behave@main"
      - name: Run tests
        run: python -m pytest
